name: Build and Test

on: [pull_request]

jobs:
  build:
    name: Build | TealiumFullstory | ${{ matrix.destination }}
    runs-on: 'macOS-15'
    timeout-minutes: 60
    strategy:
      matrix:
        destination:
          - "generic/platform=iOS"
          - "generic/platform=iOS Simulator"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Bootstrap Carthage
        run: carthage bootstrap --use-xcframeworks --platform iOS
      - name: Build
        run: xcodebuild build -scheme TealiumFullstory -destination "${{ matrix.destination }}" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

  test:
    name: Tests | TealiumFullstoryTests
    runs-on: 'macOS-15'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Bootstrap Carthage
        run: carthage bootstrap --use-xcframeworks --platform iOS
      - name: Test
        run: xcodebuild test -scheme TealiumFullstoryTests -destination "platform=iOS Simulator,OS=18.5,name=iPhone 16 Pro" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

  build_example:
    name: Example Build | TealiumFullstorySample
    runs-on: 'macOS-15'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Pod Install
        run: pod install
        working-directory: TealiumFullstorySample
      - name: Build
        working-directory: TealiumFullstorySample
        run: xcodebuild build -workspace TealiumFullstorySample.xcworkspace -scheme TealiumFullstorySample -destination "generic/platform=iOS Simulator" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
