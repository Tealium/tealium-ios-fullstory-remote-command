name: Build and Test

on: [pull_request]

jobs:
  build:
    name: Build | TealiumFullstory | generic/platform=iOS
    runs-on: 'macOS-15'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Build
        run: |
          rm -rf TealiumFullstory.xcodeproj
          xcodebuild build -scheme TealiumFullstory -destination "generic/platform=iOS" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

  test:
    name: Tests | TealiumFullstoryTests
    runs-on: 'macOS-15'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Test
        run: |
          rm -rf TealiumFullstory.xcodeproj
          xcodebuild test -scheme TealiumFullstory -destination "platform=iOS Simulator,OS=18.5,name=iPhone 16 Pro" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

  build_example:
    name: Example Build | TealiumFullstorySample
    runs-on: 'macOS-15'
    timeout-minutes: 60
    steps:
    
      - uses: actions/checkout@v4
      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Pod Install
        run: pod install
        working-directory: TealiumFullstorySample
      - name: Boot Simulator
        run: |
          xcrun simctl boot "iPhone 16 Pro" || true
          xcrun simctl list devices | grep Booted
      - name: Build
        working-directory: TealiumFullstorySample
        run: xcodebuild build -workspace TealiumFullstorySample.xcworkspace -scheme TealiumFullstorySample -destination "platform=iOS Simulator,OS=18.5,name=iPhone 16 Pro" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
